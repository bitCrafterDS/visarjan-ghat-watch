<html lang="en">
<head>

<title>Visarjan Ghat Watch | Bhopal</title>
<meta name="description" content="Ranks Bhopal's idol-immersion ghats by water-test risk before Durga visarjan, with the report page behind every number.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%8A%3C/text%3E%3C/svg%3E">
<style>
@property --pct { syntax:'<number>'; inherits:false; initial-value:0; }
:root {
  --bg:#eef3f4; --card:#ffffff; --ink:#0f1f28; --muted:#53656e; --line:#d9e3e6; --band:#e6eef0;
  --accent:#0b6f7a; --accent-ink:#ffffff; --bad:#c9302a; --ok:#1f8a5b; --warn:#b87000;
  --p1:#d1332a; --p2:#c77a00; --p3:#1f8a5b; --soft-bad:#fdeceb; --soft-warn:#fff4de; --soft-ok:#e5f5ec;

  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#09151a; --card:#11222a; --ink:#e6f0f2; --muted:#9fb3ba; --line:#223943; --band:#173039;
    --accent:#4fd1d9; --accent-ink:#05262a; --bad:#ef7b6f; --ok:#5fc08f; --warn:#e5ad4a;
    --p1:#ef7b6f; --p2:#e5ad4a; --p3:#5fc08f; --soft-bad:#33201f; --soft-warn:#33291a; --soft-ok:#1b2d25;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -8px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"] {
  --bg:#09151a; --card:#11222a; --ink:#e6f0f2; --muted:#9fb3ba; --line:#223943; --band:#173039;
  --accent:#4fd1d9; --accent-ink:#05262a; --bad:#ef7b6f; --ok:#5fc08f; --warn:#e5ad4a;
  --p1:#ef7b6f; --p2:#e5ad4a; --p3:#5fc08f; --soft-bad:#33201f; --soft-warn:#33291a; --soft-ok:#1b2d25;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -8px rgba(0,0,0,.6);
}
html { scroll-padding-top:env(safe-area-inset-top,0px); height:100%; }
* { box-sizing:border-box; }
body { margin:0; min-height:100%; background:var(--bg); color:var(--ink);
  font:16px/1.55 "Avenir Next","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Kohinoor Devanagari","Noto Sans","Noto Sans Devanagari","Mangal",Roboto,Arial,sans-serif; }
:focus-visible { outline:3px solid var(--accent); outline-offset:2px; border-radius:6px; }
.wrap { max-width:980px; margin:0 auto; padding:0 16px; }

/* ---------- hero ---------- */
.hero { position:relative; color:#f2fafb; overflow:hidden; padding:18px 0 64px;
  background:
    radial-gradient(520px 220px at 88% -10%, rgba(255,179,71,.28), transparent 70%),
    radial-gradient(700px 320px at 0% 110%, rgba(79,209,217,.22), transparent 70%),
    linear-gradient(160deg, var(--lake1) 0%, var(--lake2) 58%, var(--lake3) 100%); }
.hero .wave { position:absolute; left:0; right:0; bottom:-1px; width:100%; height:46px; display:block; }
.hero .wave path { fill:var(--bg); }
.hero .wave .back { opacity:.35; }
.hero-top { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:22px; }
.brand { display:flex; align-items:center; gap:10px; font-weight:650; letter-spacing:.01em; }
.mark { display:grid; place-items:center; width:36px; height:36px; border-radius:11px; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.22); }
.lang { display:inline-flex; padding:3px; border-radius:999px; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.22); backdrop-filter:blur(8px); }
.lang button { border:0; background:transparent; color:#f2fafb; padding:6px 14px; border-radius:999px; font:inherit; font-size:.9rem; cursor:pointer; }
.lang button[aria-pressed="true"] { background:#fff; color:var(--lake1); font-weight:650; }
h1 { font-size:clamp(1.7rem, 4.6vw, 2.6rem); line-height:1.12; margin:0 0 10px; font-weight:750; max-width:20ch; }
:lang(en) h1 { letter-spacing:-.02em; }
:lang(hi) h1 { line-height:1.35; }
.sub { margin:0; max-width:60ch; color:rgba(242,250,251,.82); }
.countdown { display:inline-flex; align-items:center; gap:9px; margin-top:16px; padding:7px 14px 7px 12px; border-radius:999px; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.22); font-size:.92rem; font-weight:600; }
.countdown i { width:10px; height:10px; border-radius:50%; background:#ffb347; box-shadow:0 0 0 0 rgba(255,179,71,.6); animation:flame 2.4s ease-out infinite; }
@keyframes flame { 0% { box-shadow:0 0 0 0 rgba(255,179,71,.55); } 70%,100% { box-shadow:0 0 0 10px rgba(255,179,71,0); } }
.stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:22px; }
.stat { padding:12px 14px; border-radius:16px; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.18); backdrop-filter:blur(8px); }
.stat b { display:block; font-size:1.75rem; line-height:1.1; font-weight:750; font-variant-numeric:tabular-nums; }
.stat span { display:block; margin-top:2px; font-size:.82rem; line-height:1.35; color:rgba(242,250,251,.8); }

/* ---------- tabs ---------- */
.main-wrap { padding-bottom:8px; }
nav.tabs { position:sticky; top:calc(env(safe-area-inset-top,0px) + 8px); z-index:20; display:flex; gap:4px; padding:5px; width:min(948px, calc(100% - 32px)); margin:-30px auto 18px;
  background:color-mix(in srgb, var(--card) 85%, transparent); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  border:1px solid var(--line); border-radius:999px; box-shadow:var(--shadow); }
nav.tabs button { flex:1; border:0; background:transparent; color:var(--muted); padding:9px 8px; border-radius:999px; font:inherit; font-size:.92rem; cursor:pointer; text-align:center; line-height:1.25; }
nav.tabs button[aria-selected="true"] { background:var(--accent); color:var(--accent-ink); font-weight:650; }

/* ---------- priority board ---------- */
.board { background:var(--card); border:1px solid var(--line); border-radius:22px; padding:16px 16px 12px; box-shadow:var(--shadow); }
.board-head { display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:4px 12px; margin-bottom:6px; }
.board-head h2 { margin:0; font-size:1.1rem; }
.brow { display:grid; grid-template-columns:1.7rem minmax(0,1.25fr) minmax(0,2fr) 2.3rem; align-items:center; gap:10px; width:100%;
  border:0; background:transparent; color:inherit; font:inherit; text-align:left; padding:7px 6px; border-radius:12px; cursor:pointer; }
button.brow:hover { background:var(--band); }
.brow.axis { padding-top:0; padding-bottom:0; cursor:default; }
.axis-track { position:relative; height:16px; }
.axis-track em { position:absolute; transform:translateX(-50%); font-style:normal; font-size:.72rem; color:var(--muted); }
.bn { width:1.7rem; height:1.7rem; border-radius:50%; display:grid; place-items:center; font-size:.85rem; font-weight:700; background:var(--band); color:var(--ink); }
.brow.p1 .bn { background:var(--p1); color:#fff; }
.bname { font-weight:600; font-size:.95rem; line-height:1.3; }
.btrack { position:relative; height:12px; border-radius:7px; background:var(--band); overflow:hidden; }
.btrack i { position:absolute; left:0; top:0; bottom:0; border-radius:7px; background:var(--p3); transform-origin:left; animation:grow .8s cubic-bezier(.2,.7,.2,1) both; }
.brow.p1 .btrack i { background:var(--p1); } .brow.p2 .btrack i { background:var(--p2); }
.btrack b { position:absolute; top:0; bottom:0; width:2px; background:var(--card); opacity:.9; }
@keyframes grow { from { transform:scaleX(0); } }
.bscore { font-weight:750; text-align:right; font-variant-numeric:tabular-nums; }

/* ---------- notice, view switch, legend ---------- */
.banner { display:flex; gap:10px; align-items:flex-start; background:var(--soft-warn); border:1px solid var(--line); border-radius:14px; padding:11px 14px; margin:14px 0; font-size:.92rem; }
.banner::before { content:"i"; flex:none; width:20px; height:20px; margin-top:1px; border-radius:50%; display:grid; place-items:center; background:var(--warn); color:#fff; font-weight:700; font-size:.8rem; font-style:italic; font-family:Georgia,serif; }
.basis { margin:10px 0 4px; }
.basis .label { font-size:.85rem; color:var(--muted); margin-bottom:6px; display:block; }
.seg { display:flex; flex-wrap:wrap; gap:6px; }
.seg button { border:1px solid var(--line); background:var(--card); color:var(--ink); padding:8px 14px; border-radius:999px; font:inherit; font-size:.9rem; cursor:pointer; }
.seg button[aria-pressed="true"] { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600; }
.basis-desc { font-size:.85rem; color:var(--muted); margin:8px 0 12px; max-width:70ch; }
.legend { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:6px 0 16px; font-size:.85rem; color:var(--muted); }
.chip { display:inline-block; padding:2px 11px; border-radius:999px; border:1px solid var(--line); background:var(--card); }
.chip.p1 { border-color:var(--p1); color:var(--p1); } .chip.p2 { border-color:var(--p2); color:var(--ink); } .chip.p3 { border-color:var(--p3); color:var(--ink); }

/* ---------- ghat cards ---------- */
.card { position:relative; scroll-margin-top:84px; background:var(--card); border:1px solid var(--line); border-radius:22px; padding:18px 18px 16px; margin-bottom:16px; box-shadow:var(--shadow); overflow:hidden; }
.card::before { content:""; position:absolute; left:0; right:0; top:0; height:5px; background:var(--p3); }
.card.p1::before { background:var(--p1); } .card.p2::before { background:var(--p2); }
.card.p1 { background:linear-gradient(180deg, var(--soft-bad) 0, var(--card) 170px); }
.card.flash { animation:flash 1.4s ease-out; }
@keyframes flash { 0% { box-shadow:0 0 0 4px var(--accent); } 100% { box-shadow:var(--shadow); } }
.card-top { display:flex; gap:14px; align-items:center; }
.rankno { font-size:2.5rem; font-weight:800; line-height:1; letter-spacing:-.03em; color:var(--muted); min-width:2.6rem; font-variant-numeric:tabular-nums; }
.rankno small { font-size:1rem; font-weight:700; margin-right:1px; vertical-align:top; position:relative; top:.35rem; }
.card.p1 .rankno { color:var(--p1); }
.card-main { flex:1; min-width:0; }
.card h2 { font-size:1.2rem; margin:0; line-height:1.3; }
.body-name { color:var(--muted); font-size:.9rem; }
.ring { --c:var(--p3); --size:78px; position:relative; flex:none; width:var(--size); height:var(--size); border-radius:50%; display:grid; place-items:center;
  background:conic-gradient(var(--c) calc(var(--pct) * 1%), var(--band) 0); animation:ringfill 1s cubic-bezier(.2,.7,.2,1) both; }
.ring::before { content:""; position:absolute; inset:8px; border-radius:50%; background:var(--card); }
.card.p1 .ring::before { background:color-mix(in srgb, var(--soft-bad) 55%, var(--card)); }
.card.p1 .ring { --c:var(--p1); } .card.p2 .ring { --c:var(--p2); }
.ring span { position:relative; text-align:center; line-height:1; }
.ring b { display:block; font-size:1.45rem; font-weight:800; font-variant-numeric:tabular-nums; }
.ring small { font-size:.62rem; color:var(--muted); }
.ring .nd { font-size:.7rem; color:var(--muted); font-weight:600; padding:0 6px; display:block; }
@keyframes ringfill { from { --pct:0; } }
.badges { display:flex; flex-wrap:wrap; gap:6px; margin:12px 0 4px; }
.badge { font-size:.8rem; padding:3px 11px; border-radius:999px; border:1px solid var(--line); background:var(--band); }
.badge.p1 { background:var(--p1); border-color:var(--p1); color:#fff; font-weight:650; }
.badge.p2 { background:var(--soft-warn); border-color:var(--p2); color:var(--ink); font-weight:650; }
.badge.p3 { background:var(--soft-ok); border-color:var(--p3); color:var(--ink); font-weight:650; }
.badge.low { background:var(--soft-warn); border-color:var(--warn); }
.used { margin:4px 0 2px; }
.cols { display:grid; grid-template-columns:1fr; gap:0 24px; }
@media (min-width:760px) { .cols { grid-template-columns:1fr 1fr; } }
.sec { margin:12px 0 4px; font-weight:650; font-size:.92rem; color:var(--ink); }
ul { margin:4px 0 8px; padding-left:20px; } li { margin:4px 0; }
ul.todo { list-style:none; padding-left:0; }
ul.todo li { position:relative; padding-left:28px; }
ul.todo li::before { content:""; position:absolute; left:2px; top:.28em; width:15px; height:15px; border-radius:5px; border:2px solid var(--accent); }
details { margin-top:12px; border-top:1px solid var(--line); padding-top:10px; }
summary { cursor:pointer; color:var(--accent); font-weight:650; list-style:none; display:flex; align-items:center; gap:8px; }
summary::-webkit-details-marker { display:none; }
summary::after { content:""; width:8px; height:8px; margin-left:2px; border-right:2px solid currentColor; border-bottom:2px solid currentColor; transform:rotate(45deg); transition:transform .2s; }
details[open] > summary::after { transform:rotate(-135deg); }

/* ---------- charts and tables (unchanged classes) ---------- */
.chart-title { font-size:.9rem; font-weight:650; margin:14px 0 2px; }
svg.chart { width:100%; height:auto; display:block; background:var(--card); }
svg.chart text { fill:var(--muted); font-size:10px; font-family:inherit; }
svg.chart .lim { stroke:var(--bad); stroke-width:1; stroke-dasharray:4 3; opacity:.8; }
svg.chart .grid { stroke:var(--line); stroke-width:1; }
svg.chart .ptok { fill:var(--ok); } svg.chart .ptbad { fill:var(--bad); }
svg.chart .join { stroke:var(--muted); stroke-width:1; opacity:.45; fill:none; }
svg.chart text.miss { fill:var(--muted); font-size:14px; text-anchor:middle; }
svg.chart text.evl { fill:var(--ink); font-size:11px; text-anchor:middle; }
svg.chart text.none { font-size:9px; text-anchor:middle; }
svg.chart text.tick { text-anchor:end; } svg.chart text.limtick { fill:var(--bad); font-weight:700; }
.keyrow { display:flex; flex-wrap:wrap; gap:12px; font-size:.8rem; color:var(--muted); margin:6px 0; align-items:center; }
.dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:4px; vertical-align:middle; }
.dot.ok { background:var(--ok); } .dot.bad { background:var(--bad); }
.tablewrap { overflow-x:auto; max-width:100%; border:1px solid var(--line); border-radius:12px; }
table { border-collapse:collapse; width:100%; font-size:.85rem; }
th, td { border-bottom:1px solid var(--line); padding:6px 10px; text-align:left; white-space:nowrap; }
th { color:var(--muted); font-weight:650; background:var(--band); }
td.num { text-align:right; font-variant-numeric:tabular-nums; }
td.bad { color:var(--bad); font-weight:700; } td.missing { color:var(--muted); }
tr.noevent td { color:var(--muted); font-style:italic; }
a { color:var(--accent); }
.note { font-size:.85rem; color:var(--muted); }

/* ---------- brief and method ---------- */
.actions { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0; }
.actions button { padding:10px 18px; border-radius:12px; font:inherit; font-size:.92rem; cursor:pointer; }
button.primary { background:var(--accent); color:var(--accent-ink); border:0; font-weight:650; }
button.wa { background:#1fa855; color:#fff; border:0; font-weight:650; }
button.ghost { background:var(--card); color:var(--ink); border:1px solid var(--line); }
pre.brief { white-space:pre-wrap; word-wrap:break-word; font:inherit; font-size:.95rem; background:var(--card); border:1px solid var(--line); border-radius:20px; padding:22px 22px; line-height:1.7; box-shadow:var(--shadow); max-width:78ch; }
.method { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:6px 22px 18px; box-shadow:var(--shadow); max-width:78ch; }
.method h2 { font-size:1.08rem; margin:20px 0 4px; padding-left:12px; border-left:4px solid var(--accent); }
.method p { margin:4px 0; }
footer { margin:24px 0 12px; color:var(--muted); font-size:.82rem; }

@media (max-width:560px) {
  .brow { grid-template-columns:1.7rem minmax(0,1fr) 2.3rem; row-gap:6px; }
  .brow .btrack { grid-column:2 / 4; grid-row:2; }
  .brow.axis .axis-track { grid-column:2 / 4; }
  .brow.axis > span:first-child, .brow.axis > span:nth-child(2), .brow.axis > span:last-child { display:none; }
  .stats { grid-template-columns:1fr; }
  .stat { display:flex; align-items:center; gap:14px; padding:10px 14px; }
  .stat b { font-size:1.5rem; min-width:3.6rem; }
  .stat span { margin:0; flex:1; text-align:left; font-size:.8rem; }
  .rankno { font-size:2rem; min-width:2.1rem; }
  .ring { --size:64px; } .ring b { font-size:1.2rem; } .ring::before { inset:7px; }
  .card { padding:16px 14px 14px; }
  nav.tabs button { font-size:.84rem; padding:9px 4px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; scroll-behavior:auto !important; } }
@media print {
  .hero { background:none; color:#000; padding:0 0 8px; overflow:visible; }
  .hero .wave, .hero .lang, .hero .stats, .hero .countdown, .hero .mark, nav.tabs, .board, .actions, .banner, footer { display:none !important; }
  .sub { color:#333; } h1 { max-width:none; }
  body { background:#fff; color:#000; }
  pre.brief, .method, .card { border:0; box-shadow:none; padding:0; background:none; }
}
</style>

":"","pg":65,"bad":true}]}],"brief":{"en":"VISARJAN GHAT WATCH: brief for the BMC officer\nDurga Visarjan: 20 October 2026\n\nBasis: MPPCB water tests at 7 Bhopal ghats, 2023 to 2025, compared with CPCB class B (outdoor bathing) limits: dissolved oxygen (DO) 5 mg/l or more, BOD 3 mg/l or less, pH 6.5 to 8.5.\n\nHeadline: across all readings, DO was below 5 mg/l in 42 of 116 tests and BOD was above 3 mg/l in 100 of 112 tests.\n\nRanking (relative priority for extra cleaning, aeration and testing):\n1. Bairagarh (Sant Hirdaram) kund, score 42/100: DO below limit in 11 of 13 tests, BOD above limit in 13 of 13 tests.\n2. Malikhedi kund, score 31/100: DO below limit in 9 of 13 tests, BOD above limit in 11 of 13 tests.\n3. Shahpura lake ghat, score 28/100: DO below limit in 5 of 18 tests, BOD above limit in 18 of 18 tests.\n4. Rani Kamlapati ghat / Kamla Park kund, score 26/100: DO below limit in 6 of 18 tests, BOD above limit in 18 of 18 tests.\n5. Hathaikheda dam / kund, score 23/100: DO below limit in 0 of 18 tests, BOD above limit in 16 of 18 tests.\n6. Khatlapura ghat, score 22/100: DO below limit in 8 of 18 tests, BOD above limit in 15 of 17 tests.\n7. Prempura ghat, score 13/100: DO below limit in 3 of 18 tests, BOD above limit in 9 of 15 tests.\n\nSuggested before 20 October:\n- Bairagarh (Sant Hirdaram) kund: Prioritise aeration or other oxygen support before immersion. Plan extra cleaning of organic waste and immersion material (BOD is repeatedly above the limit). Test before 20 October to fill the data gaps.\n  Data gaps: No Durga 2025 table in the MPPCB report, so there is no data for it. Ganesh 2025, before immersion and one week after: DO, BOD, pH not sampled.\n- Malikhedi kund: Prioritise aeration or other oxygen support before immersion. Plan extra cleaning of organic waste and immersion material (BOD is repeatedly above the limit). Test before 20 October to fill the data gaps.\n  Data gaps: No Durga 2025 table in the MPPCB report, so there is no data for it. Ganesh 2025, before immersion and one week after: DO, BOD, pH not sampled.\n- Shahpura lake ghat: Plan extra cleaning of organic waste and immersion material (BOD is repeatedly above the limit).\n- Any new ghat has no readings in this data. Take a baseline test before it is used.\n\nLimits of this brief:\n- This is a relative ranking of the 7 ghats, not a safe or unsafe verdict. Even the lowest-ranked ghat went beyond a limit in 14 of 50 tests.\n- A blank in the MPPCB reports means not sampled, never clean. Total coliform is not in this data.\n- The reports print no units. Standard units are assumed. No health effects are claimed.\n- Every number can be traced to its MPPCB report page in the tool.","hi":"विसर्जन घाट वॉच: नगर निगम अधिकारी के लिए संक्षिप्त रिपोर्ट\nदुर्गा विसर्जन: 20 अक्टूबर 2026\n\nआधार: भोपाल के 7 घाटों पर MPPCB की 2023 से 2025 की जल-जाँच, CPCB श्रेणी-B (खुले में स्नान) के मानकों से तुलना: घुली ऑक्सीजन (DO) 5 mg/l या अधिक, BOD 3 mg/l या कम, pH 6.5 से 8.5।\n\nमुख्य बात: सभी जाँचों में DO 116 में से 42 बार 5 mg/l से कम और BOD 112 में से 100 बार 3 mg/l से अधिक रहा।\n\nप्राथमिकता क्रम (अतिरिक्त सफाई, एयरेशन और जाँच के लिए):\n1. बैरागढ़ (संत हिरदाराम) कुंड, अंक 42/100: DO मानक से कम 13 में से 11 जाँच में, BOD मानक से अधिक 13 में से 13 जाँच में।\n2. मालीखेड़ी कुंड, अंक 31/100: DO मानक से कम 13 में से 9 जाँच में, BOD मानक से अधिक 13 में से 11 जाँच में।\n3. शाहपुरा लेक घाट, अंक 28/100: DO मानक से कम 18 में से 5 जाँच में, BOD मानक से अधिक 18 में से 18 जाँच में।\n4. रानी कमलापति घाट / कमला पार्क कुंड, अंक 26/100: DO मानक से कम 18 में से 6 जाँच में, BOD मानक से अधिक 18 में से 18 जाँच में।\n5. हथाईखेड़ा डैम / कुंड, अंक 23/100: DO मानक से कम 18 में से 0 जाँच में, BOD मानक से अधिक 18 में से 16 जाँच में।\n6. खटलापुरा घाट, अंक 22/100: DO मानक से कम 18 में से 8 जाँच में, BOD मानक से अधिक 17 में से 15 जाँच में।\n7. प्रेमपुरा घाट, अंक 13/100: DO मानक से कम 18 में से 3 जाँच में, BOD मानक से अधिक 15 में से 9 जाँच में।\n\n20 अक्टूबर से पहले सुझाव:\n- बैरागढ़ (संत हिरदाराम) कुंड: विसर्जन से पहले एयरेशन या ऑक्सीजन बढ़ाने के उपाय को प्राथमिकता दें। जैविक कचरे और विसर्जन-सामग्री की अतिरिक्त सफाई की योजना बनाएँ (BOD बार-बार सीमा से ऊपर है)। डेटा की कमियों को भरने के लिए 20 अक्टूबर से पहले जाँच कराएँ।\n  डेटा की कमियाँ: MPPCB रिपोर्ट में दुर्गा 2025 की तालिका नहीं है, इसलिए इसका कोई डेटा नहीं है। गणेश 2025, विसर्जन से पहले और विसर्जन के एक सप्ताह बाद: DO, BOD, pH की जाँच नहीं हुई।\n- मालीखेड़ी कुंड: विसर्जन से पहले एयरेशन या ऑक्सीजन बढ़ाने के उपाय को प्राथमिकता दें। जैविक कचरे और विसर्जन-सामग्री की अतिरिक्त सफाई की योजना बनाएँ (BOD बार-बार सीमा से ऊपर है)। डेटा की कमियों को भरने के लिए 20 अक्टूबर से पहले जाँच कराएँ।\n  डेटा की कमियाँ: MPPCB रिपोर्ट में दुर्गा 2025 की तालिका नहीं है, इसलिए इसका कोई डेटा नहीं है। गणेश 2025, विसर्जन से पहले और विसर्जन के एक सप्ताह बाद: DO, BOD, pH की जाँच नहीं हुई।\n- शाहपुरा लेक घाट: जैविक कचरे और विसर्जन-सामग्री की अतिरिक्त सफाई की योजना बनाएँ (BOD बार-बार सीमा से ऊपर है)।\n- कोई भी नया घाट इस डेटा में नहीं है। उपयोग से पहले आधारभूत जाँच कराएँ।\n\nइस रिपोर्ट की सीमाएँ:\n- यह 7 घाटों का सापेक्ष क्रम है, सुरक्षित या असुरक्षित का फ़ैसला नहीं। सबसे नीचे वाला घाट भी 50 में से 14 जाँच में किसी मानक से बाहर रहा।\n- MPPCB रिपोर्ट में खाली जगह का मतलब जाँच नहीं हुई, साफ़ नहीं। कुल कॉलिफ़ॉर्म इस डेटा में नहीं है।\n- रिपोर्ट में इकाइयाँ नहीं छपी हैं, मानक इकाइयाँ मानी गई हैं। स्वास्थ्य पर असर का कोई दावा नहीं किया गया है।\n- हर संख्या को टूल में MPPCB रिपोर्ट के पेज से मिलाया जा सकता है।"}};

const EVENTS = [['Ganesh',2023],['Durga',2023],['Ganesh',2024],['Durga',2024],['Ganesh',2025],['Durga',2025]];
const PHASES = ['pre','during','after'];
const FEST = { en: {Ganesh:'Ganesh', Durga:'Durga'}, hi: {Ganesh:'गणेश', Durga:'दुर्गा'} };
const PHN = { en: {pre:'before', during:'during', after:'1 week after'}, hi: {pre:'पहले', during:'दौरान', after:'1 सप्ताह बाद'} };
const POSS = { recency: 54, durga: 27, latest: 18 };
const PCFG = {
  'Dissolved oxygen': { min:0, max:12, ticks:[0,5,10], limits:[5], unit:' mg/l', key:'chart_do' },
  'BOD':              { min:0, max:24, ticks:[0,3,12,24], limits:[3], unit:' mg/l', key:'chart_bod' },
  'pH':               { min:5.5, max:9.5, ticks:[6,6.5,7,8,8.5,9], limits:[6.5,8.5], unit:'', key:'chart_ph' }
};

/* ---------- state ---------- */
let lang = 'en', basis = D.default_basis, tab = 'rank';
const openCards = new Set();
try { const s = localStorage.getItem('gw_lang'); if (s === 'hi' || s === 'en') lang = s; } catch (e) {}

const t = k => UI[lang][k];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => String(n).replace(/\.0$/, '');
const fill = (s, o) => s.replace(/\{(\w+)\}/g, (_, k) => o[k]);
const pageLink = (yr, pg) => `<a href="${esc(D.meta.reports[yr].url)}#page=${pg}" target="_blank" rel="noopener">${t('page')} ${pg}</a>`;

/* ---------- pieces ---------- */
function daysLeft() {
  const target = new Date(D.meta.durga_date + 'T00:00:00+05:30').getTime();
  const n = Math.ceil((target - Date.now()) / 86400000);
  if (n > 0) return fill(t('days'), { n });
  if (n === 0 || (n < 0 && n > -1)) return t('today');
  return '';
}

function confidenceFor(g, sc) {
  const poss = POSS[basis] || D.meta.expected_per_ghat;
  const c = sc.tested / poss;
  let level = c >= 0.9 ? 'High' : c >= 0.6 ? 'Medium' : 'Low';
  if (g.m.medium_site_match && level === 'High') level = 'Medium';
  return { level, poss };
}

function chart(g, param) {
  const c = PCFG[param];
  const W = 640, H = 170, ml = 34, mr = 8, mt = 10, mb = 30;
  const pw = W - ml - mr, ph = H - mt - mb, cw = pw / 6;
  const y = v => mt + (c.max - Math.min(Math.max(v, c.min), c.max)) / (c.max - c.min) * ph;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t(c.key))}">`;
  EVENTS.forEach(([f, yr], ei) => {
    const x0 = ml + ei * cw;
    s += `<rect x="${x0}" y="${mt}" width="${cw}" height="${ph}" fill="${ei % 2 === 0 ? 'var(--band)' : 'transparent'}"/>`;
    const evMissing = g.missing_events.some(e => e[0] === f && e[1] === yr);
    s += `<text class="evl" x="${x0 + cw / 2}" y="${H - 10}">${esc(FEST[lang][f])} '${String(yr).slice(2)}</text>`;
    if (evMissing) {
      s += `<rect x="${x0 + 3}" y="${mt}" width="${cw - 6}" height="${ph}" fill="url(#hatch)"><title>${esc(t('no_table'))}</title></rect>`;
      s += `<text class="none" x="${x0 + cw / 2}" y="${mt + ph / 2}">${esc(t('leg_none'))}</text>`;
      return;
    }
    const pts = [];
    PHASES.forEach((phs, pi) => {
      const x = x0 + cw * (0.2 + 0.3 * pi);
      const r = g.readings.find(q => q.p === param && q.f === f && q.y === yr && q.ph === phs);
      const label = `${FEST[lang][f]} ${yr}, ${PHN[lang][phs]}`;
      if (!r || r.v === null) {
        s += `<text class="miss" x="${x}" y="${y(c.min) - 5}">×<title>${esc(label)}: ${esc(t('leg_miss'))}</title></text>`;
        return;
      }
      pts.push([x, y(r.v)]);
      const tip = `${label}: ${fmt(r.v)}${c.unit} (${t('page')} ${r.pg})`;
      s += `<circle class="${r.bad ? 'ptbad' : 'ptok'}" cx="${x}" cy="${y(r.v)}" r="4.5"><title>${esc(tip)}</title></circle>`;
    });
    if (pts.length > 1) s += `<polyline class="join" points="${pts.map(p => p.join(',')).join(' ')}"/>`;
  });
  c.ticks.forEach(v => {
    const isLim = c.limits.includes(v);
    s += `<line class="grid" x1="${ml}" x2="${W - mr}" y1="${y(v)}" y2="${y(v)}"/>`;
    s += `<text class="tick${isLim ? ' limtick' : ''}" x="${ml - 5}" y="${y(v) + 3}">${v}</text>`;
  });
  c.limits.forEach(v => { s += `<line class="lim" x1="${ml}" x2="${W - mr}" y1="${y(v)}" y2="${y(v)}"/>`; });
  return s + '</svg>';
}

function readingsTable(g) {
  const cell = (r, pbad) => {
    if (!r || r.v === null) return `<td class="num missing" title="${esc(t('leg_miss'))}">${esc('—')}</td>`;
    return `<td class="num${r.bad ? ' bad' : ''}">${fmt(r.v)}</td>`;
  };
  let rows = '';
  EVENTS.forEach(([f, yr]) => {
    if (g.missing_events.some(e => e[0] === f && e[1] === yr)) {
      rows += `<tr class="noevent"><td>${esc(FEST[lang][f])} ${yr}</td><td colspan="5">${esc(t('no_table'))}</td></tr>`;
      return;
    }
    PHASES.forEach(phs => {
      const get = p => g.readings.find(q => q.p === p && q.f === f && q.y === yr && q.ph === phs);
      const rr = [get('pH'), get('Dissolved oxygen'), get('BOD')];
      const pages = [...new Set(rr.filter(r => r && r.pg).map(r => r.pg))].sort((a, b) => a - b);
      rows += `<tr><td>${esc(FEST[lang][f])} ${yr}</td><td>${esc(PHN[lang][phs])}</td>${rr.map(cell).join('')}<td>${pages.map(p => pageLink(yr, p)).join(', ')}</td></tr>`;
    });
  });
  return `<div class="tablewrap"><table><thead><tr><th>${t('col_event')}</th><th>${t('col_phase')}</th><th class="num">pH</th><th class="num">DO mg/l</th><th class="num">BOD mg/l</th><th>${t('col_page')}</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function card(g) {
  const sc = g.scores[basis];
  const pr = sc.priority || 3;
  const cf = confidenceFor(g, sc);
  const rr = g.rank_range[0] === g.rank_range[1]
    ? fill(t('same_rank'), { a: g.rank_range[0] })
    : fill(t('range_rank'), { a: g.rank_range[0], b: g.rank_range[1] });
  const isOpen = openCards.has(g.id) ? ' open' : '';
  const years = [...new Set(g.readings.map(r => r.y))];
  const idx = D.ghats.indexOf(g);
  const scoreNum = sc.score === null ? null : Math.round(sc.score);
  const ring = scoreNum === null
    ? `<div class="ring" style="--pct:0" role="img" aria-label="${esc(t('score'))}: ${esc(t('nodata'))}"><span><i class="nd">${esc(t('nodata'))}</i></span></div>`
    : `<div class="ring" style="--pct:${sc.score}" role="img" aria-label="${esc(t('score'))} ${scoreNum}/100"><span><b>${scoreNum}</b><small>/100</small></span></div>`;
  return `
  <article class="card p${pr}" id="g-${idx}">
    <div class="card-top">
      <div class="rankno"><small>#</small>${sc.rank}</div>
      <div class="card-main">
        <h2>${esc(g['name_' + lang])}</h2>
        <div class="body-name">${esc(g['body_' + lang])}</div>
      </div>
      ${ring}
    </div>
    <div class="badges">
      <span class="badge p${pr}">${esc(t('p' + pr))}</span>
      <span class="badge${cf.level === 'High' ? '' : ' low'}">${esc(t('conf'))}: ${esc(t(cf.level))}</span>
      <span class="badge">${esc(rr)}</span>
    </div>
    <div class="note used">${esc(t('score'))} · ${esc(fill(t('used'), { a: sc.tested, b: cf.poss }))}</div>
    <div class="cols">
      <div>
        <div class="sec">${esc(t('why'))}</div>
        <ul>${g.reasons[lang].map(x => `<li>${esc(x)}</li>`).join('')}</ul>
      </div>
      <div>
        <div class="sec">${esc(t('todo'))}</div>
        <ul class="todo">${g.actions[lang].map(x => `<li>${esc(x)}</li>`).join('')}</ul>
      </div>
    </div>
    <details data-id="${esc(g.id)}"${isOpen}>
      <summary>${esc(t('details'))}</summary>
      <div class="sec">${esc(t('gaps'))}</div>
      ${g.gaps[lang].length ? `<ul>${g.gaps[lang].map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : `<p class="note">${esc(t('nogaps'))}</p>`}
      <p class="note">${esc(t('charts_note'))}</p>
      <div class="keyrow"><span><i class="dot ok"></i>${esc(t('leg_ok'))}</span><span><i class="dot bad"></i>${esc(t('leg_bad'))}</span><span>× ${esc(t('leg_miss'))}</span><span>▨ ${esc(t('leg_none'))}</span></div>
      ${['Dissolved oxygen', 'BOD', 'pH'].map(p => `<div class="chart-title">${esc(t(PCFG[p].key))}</div>${chart(g, p)}`).join('')}
      <div class="chart-title">${esc(t('table'))}</div>
      ${readingsTable(g)}
      ${g.metals[lang] ? `<p class="note">${esc(g.metals[lang])}</p>` : ''}
      <p class="note"><b>${esc(t('sources'))}:</b> ${years.map(y => `<a href="${esc(D.meta.reports[y].url)}" target="_blank" rel="noopener">${esc(D.meta.reports[y].name)}</a>`).join(' · ')}</p>
    </details>
  </article>`;
}

function boardView(list) {
  const vals = list.map(g => g.scores[basis].score || 0);
  const scale = Math.max(60, Math.ceil(Math.max(...vals) / 10) * 10);
  const pos = v => (v / scale * 100).toFixed(1) + '%';
  const rows = list.map(g => {
    const sc = g.scores[basis];
    const pr = sc.priority || 3;
    return `<button class="brow p${pr}" data-jump="g-${D.ghats.indexOf(g)}">
      <span class="bn">${sc.rank}</span>
      <span class="bname">${esc(g['name_' + lang])}</span>
      <span class="btrack"><i style="width:${pos(sc.score || 0)}"></i><b style="left:${pos(D.meta.p2)}"></b><b style="left:${pos(D.meta.p1)}"></b></span>
      <span class="bscore">${sc.score === null ? '–' : Math.round(sc.score)}</span>
    </button>`;
  }).join('');
  return `<section class="board" aria-label="${esc(t('board'))}">
    <div class="board-head"><h2>${esc(t('board'))}</h2><span class="note">${esc(t('board_hint'))}</span></div>
    <div class="brow axis" aria-hidden="true"><span></span><span></span>
      <span class="axis-track"><em style="left:${pos(D.meta.p2)}">${D.meta.p2}</em><em style="left:${pos(D.meta.p1)}">${D.meta.p1}</em></span><span></span></div>
    ${rows}
  </section>`;
}

function rankView() {
  const list = [...D.ghats].sort((a, b) => a.scores[basis].rank - b.scores[basis].rank);
  const b = D.bases.find(x => x.id === basis);
  return `
  ${boardView(list)}
  <div class="banner">${esc(t('banner'))}</div>
  <div class="basis"><span class="label">${esc(t('basis'))}</span>
    <div class="seg">${D.bases.map(x => `<button data-basis="${x.id}" aria-pressed="${x.id === basis}">${esc(x[lang])}</button>`).join('')}</div>
    <div class="basis-desc">${esc(b['desc_' + lang])}</div></div>
  <div class="legend"><span>${esc(t('legend_title'))}</span>
    <span class="chip p1">${esc(t('p1s'))}</span><span class="chip p2">${esc(t('p2s'))}</span><span class="chip p3">${esc(t('p3s'))}</span></div>
  ${list.map(card).join('')}`;
}

function briefView() {
  return `
  <p class="note">${esc(t('brief_note'))}</p>
  <div class="actions">
    <button class="primary" data-copy="one">${esc(t('copy'))}</button>
    <button class="ghost" data-copy="both">${esc(t('copy_both'))}</button>
    <button class="ghost" data-print="1">${esc(t('print'))}</button>
    <button class="wa" data-wa="1">${esc(t('wa'))}</button>
    <button class="ghost" data-csv="1">${esc(t('csv'))}</button>
  </div>
  <pre class="brief" id="brief">${esc(D.brief[lang])}</pre>`;
}

function methodView() {
  return `<div class="method">${METHOD[lang].map(sec => `
    <h2>${esc(sec.h)}</h2>
    ${(sec.p || []).map(p => `<p>${esc(p)}</p>`).join('')}
    ${sec.items ? `<ul>${sec.items.map(i => `<li>${esc(i)}</li>`).join('')}</ul>` : ''}`).join('')}</div>`;
}

function shell() {
  const left = daysLeft();
  const h = D.headline;
  const isRank = tab === 'rank';
  const stats = isRank ? `
      <div class="stats">
        <div class="stat"><b>${h.do_below}/${h.do_tested}</b><span>${esc(t('h_do'))}</span></div>
        <div class="stat"><b>${h.bod_above}/${h.bod_tested}</b><span>${esc(t('h_bod'))}</span></div>
        <div class="stat"><b>${h.bairagarh_do_zero}</b><span>${esc(t('h_zero'))}</span></div>
      </div>` : '';
  return `
  <div class="hero">
    <div class="wrap">
      <div class="hero-top">
        <div class="brand"><span class="mark"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 8c3 0 3-2 6-2s3 2 6 2 3-2 6-2M3 13c3 0 3-2 6-2s3 2 6 2 3-2 6-2M3 18c3 0 3-2 6-2s3 2 6 2 3-2 6-2"/></svg></span><span>${esc(t('title'))}</span></div>
        <div class="lang" role="group" aria-label="Language">
          <button data-lang="en" aria-pressed="${lang === 'en'}">EN</button>
          <button data-lang="hi" aria-pressed="${lang === 'hi'}">हिं</button>
        </div>
      </div>
      <h1>${esc(t('hero'))}</h1>
      <p class="sub">${esc(t('sub'))}</p>
      ${left ? `<span class="countdown"><i></i>${esc(left)}</span>` : ''}
      ${stats}
    </div>
    <svg class="wave" viewBox="0 0 1440 46" preserveAspectRatio="none" aria-hidden="true"><path class="back" d="M0 22C220 52 440 -6 720 22S1220 48 1440 14V46H0Z"/><path d="M0 34C260 8 520 52 800 32S1230 12 1440 36V46H0Z"/></svg>
  </div>
  <nav class="tabs" role="tablist">
    ${[['rank', 'tab_rank'], ['brief', 'tab_brief'], ['method', 'tab_method']].map(([k, l]) =>
      `<button role="tab" data-tab="${k}" aria-selected="${tab === k}">${esc(t(l))}</button>`).join('')}
  </nav>
  <div class="wrap main-wrap">
    <main>${tab === 'rank' ? rankView() : tab === 'brief' ? briefView() : methodView()}</main>
    <footer>${esc(fill(t('built'), { d: D.meta.built }))}</footer>
  </div>`;
}

const LIVE_URL = 'https://bitcrafterds.github.io/visarjan-ghat-watch/';
function sortedGhats() { return [...D.ghats].sort((a, b) => a.scores[D.default_basis].rank - b.scores[D.default_basis].rank); }
function waMessage() {
  const hi = lang === 'hi';
  const lines = [hi ? 'विसर्जन घाट वॉच: दुर्गा विसर्जन 20 अक्टूबर 2026' : 'Visarjan Ghat Watch: Durga visarjan, 20 October 2026',
                 hi ? 'प्राथमिकता क्रम (सापेक्ष, सुरक्षित/असुरक्षित नहीं):' : 'Priority order (relative, not safe/unsafe):'];
  sortedGhats().forEach(g => {
    const sc = g.scores[D.default_basis];
    lines.push(sc.rank + '. ' + g['name_' + lang] + ' - ' + (sc.score === null ? '-' : Math.round(sc.score)) + '/100 (P' + (sc.priority || 3) + ')');
  });
  lines.push('', (hi ? 'पूरी रिपोर्ट और हर संख्या का रिपोर्ट-पेज: ' : 'Full brief and report page behind every number: ') + LIVE_URL);
  return lines.join('\n');
}
function downloadCsv() {
  const q = v => '"' + String(v).replace(/"/g, '""') + '"';
  const rows = [['rank', 'ghat', 'risk_score_0_100', 'priority', 'readings_used', 'data_confidence']];
  [...D.ghats].sort((a, b) => a.scores[basis].rank - b.scores[basis].rank).forEach(g => {
    const sc = g.scores[basis];
    rows.push([sc.rank, g.name_en, sc.score === null ? '' : sc.score, sc.priority || 3, sc.tested, g.confidence]);
  });
  const blob = new Blob(['\ufeff' + rows.map(r => r.map(q).join(',')).join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'ghat_risk_ranking_' + basis + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
}

async function copyText(txt, btn) {
  try { await navigator.clipboard.writeText(txt); }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (_) {} ta.remove();
  }
  const old = btn.textContent; btn.textContent = t('copied');
  setTimeout(() => { btn.textContent = old; }, 1500);
}

function render() {
  document.documentElement.lang = lang;
  document.getElementById('app').innerHTML = shell();
}

document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.lang) { lang = b.dataset.lang; try { localStorage.setItem('gw_lang', lang); } catch (_) {} render(); }
  else if (b.dataset.tab) { tab = b.dataset.tab; render(); }
  else if (b.dataset.basis) { basis = b.dataset.basis; render(); }
  else if (b.dataset.copy) { copyText(b.dataset.copy === 'both' ? D.brief.en + '\n\n' + '────────\n\n' + D.brief.hi : D.brief[lang], b); }
  else if (b.dataset.print) { window.print(); }
  else if (b.dataset.wa) { window.open('https://wa.me/?text=' + encodeURIComponent(waMessage()), '_blank', 'noopener'); }
  else if (b.dataset.csv) { downloadCsv(); }
  else if (b.dataset.jump) {
    const el = document.getElementById(b.dataset.jump);
    if (el) {
      el.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
      el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
    }
  }
});
document.addEventListener('toggle', e => {
  const d = e.target;
  if (d && d.tagName === 'DETAILS' && d.dataset.id) { d.open ? openCards.add(d.dataset.id) : openCards.delete(d.dataset.id); }
}, true);

render();
</script>
</body>
</html>
