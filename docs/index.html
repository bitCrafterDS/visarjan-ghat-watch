<style>
:root {
  --bg:#f6f4ee; --card:#ffffff; --ink:#1c2331; --muted:#5b6475; --line:#e2ded3; --band:#f3f1ea;
  --accent:#0a6c70; --accent-ink:#ffffff; --bad:#c0392b; --ok:#2b7a57; --warn:#c27c0e;
  --p1:#c0392b; --p2:#c27c0e; --p3:#2b7a57; --soft-bad:#fbeceb; --soft-warn:#fcf3e1; --soft-ok:#e8f4ee;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#12161d; --card:#1b212b; --ink:#e8ebf1; --muted:#a2abbb; --line:#2d3543; --band:#202735;
    --accent:#4fc1c6; --accent-ink:#0c1a1b; --bad:#ef7b6f; --ok:#5fc08f; --warn:#e5ad4a;
    --p1:#ef7b6f; --p2:#e5ad4a; --p3:#5fc08f; --soft-bad:#33201f; --soft-warn:#33291a; --soft-ok:#1b2d25;
  }
}
:root[data-theme="dark"] {
  --bg:#12161d; --card:#1b212b; --ink:#e8ebf1; --muted:#a2abbb; --line:#2d3543; --band:#202735;
  --accent:#4fc1c6; --accent-ink:#0c1a1b; --bad:#ef7b6f; --ok:#5fc08f; --warn:#e5ad4a;
  --p1:#ef7b6f; --p2:#e5ad4a; --p3:#5fc08f; --soft-bad:#33201f; --soft-warn:#33291a; --soft-ok:#1b2d25;
}
html { scroll-padding-top:env(safe-area-inset-top,0px); height:100%; }
* { box-sizing:border-box; }
body { margin:0; min-height:100%; background:var(--bg); color:var(--ink);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI","Noto Sans","Noto Sans Devanagari","Mangal",Roboto,Arial,sans-serif; }
.wrap { max-width:920px; margin:0 auto; padding:16px; }
header { display:flex; flex-wrap:wrap; gap:12px; align-items:flex-start; justify-content:space-between; margin-bottom:8px; }
h1 { font-size:1.6rem; line-height:1.2; margin:0 0 4px; }
.sub { color:var(--muted); margin:0; max-width:620px; }
.lang { display:inline-flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; background:var(--card); }
.lang button { border:0; background:transparent; color:var(--ink); padding:6px 14px; font:inherit; cursor:pointer; }
.lang button[aria-pressed="true"] { background:var(--accent); color:var(--accent-ink); }
.countdown { display:inline-block; margin-top:8px; padding:4px 12px; border-radius:999px; background:var(--soft-warn); color:var(--ink); font-size:.9rem; border:1px solid var(--line); }
nav.tabs { display:flex; gap:6px; flex-wrap:wrap; margin:14px 0; border-bottom:1px solid var(--line); }
nav.tabs button { border:0; background:transparent; color:var(--muted); padding:10px 14px; font:inherit; cursor:pointer; border-bottom:3px solid transparent; }
nav.tabs button[aria-selected="true"] { color:var(--ink); border-bottom-color:var(--accent); font-weight:600; }
.banner { background:var(--soft-warn); border:1px solid var(--line); border-radius:10px; padding:10px 14px; margin-bottom:14px; font-size:.95rem; }
.stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px; margin-bottom:14px; }
.stat { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
.stat b { display:block; font-size:1.8rem; line-height:1.1; color:var(--bad); }
.stat span { color:var(--muted); font-size:.9rem; }
.basis { margin:10px 0 4px; }
.basis .label { font-size:.85rem; color:var(--muted); margin-bottom:4px; display:block; }
.seg { display:flex; flex-wrap:wrap; gap:6px; }
.seg button { border:1px solid var(--line); background:var(--card); color:var(--ink); padding:7px 12px; border-radius:999px; font:inherit; font-size:.9rem; cursor:pointer; }
.seg button[aria-pressed="true"] { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
.basis-desc { font-size:.85rem; color:var(--muted); margin:6px 0 12px; }
.legend { display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 14px; font-size:.85rem; }
.chip { display:inline-block; padding:2px 10px; border-radius:999px; border:1px solid var(--line); background:var(--card); }
.chip.p1 { border-color:var(--p1); color:var(--p1); } .chip.p2 { border-color:var(--p2); color:var(--p2); } .chip.p3 { border-color:var(--p3); color:var(--p3); }
.card { background:var(--card); border:1px solid var(--line); border-left:6px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:12px; }
.card.p1 { border-left-color:var(--p1); } .card.p2 { border-left-color:var(--p2); } .card.p3 { border-left-color:var(--p3); }
.card-top { display:flex; gap:12px; align-items:flex-start; }
.rank { font-size:1.9rem; font-weight:700; line-height:1; min-width:2.2rem; color:var(--muted); }
.card-main { flex:1; min-width:0; }
.card h2 { font-size:1.15rem; margin:0; line-height:1.3; }
.body-name { color:var(--muted); font-size:.9rem; }
.badges { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
.badge { font-size:.8rem; padding:2px 10px; border-radius:999px; border:1px solid var(--line); background:var(--band); }
.badge.p1 { background:var(--soft-bad); border-color:var(--p1); color:var(--p1); font-weight:600; }
.badge.p2 { background:var(--soft-warn); border-color:var(--p2); color:var(--ink); font-weight:600; }
.badge.p3 { background:var(--soft-ok); border-color:var(--p3); color:var(--ink); font-weight:600; }
.badge.low { background:var(--soft-warn); border-color:var(--warn); }
.scorerow { display:flex; align-items:center; gap:10px; margin:6px 0; font-size:.9rem; }
.bar { flex:1; height:10px; background:var(--band); border-radius:6px; overflow:hidden; border:1px solid var(--line); }
.bar span { display:block; height:100%; background:var(--p3); }
.card.p1 .bar span { background:var(--p1); } .card.p2 .bar span { background:var(--p2); }
.scorenum { font-weight:700; min-width:3.2rem; text-align:right; }
.sec { margin:10px 0 2px; font-weight:600; font-size:.9rem; color:var(--muted); text-transform:none; }
ul { margin:4px 0 8px; padding-left:20px; } li { margin:3px 0; }
details { margin-top:10px; border-top:1px dashed var(--line); padding-top:8px; }
summary { cursor:pointer; color:var(--accent); font-weight:600; }
.chart-title { font-size:.9rem; font-weight:600; margin:12px 0 2px; }
svg.chart { width:100%; height:auto; display:block; background:var(--card); }
svg.chart text { fill:var(--muted); font-size:10px; font-family:inherit; }
svg.chart .lim { stroke:var(--bad); stroke-width:1; stroke-dasharray:4 3; opacity:.8; }
svg.chart .grid { stroke:var(--line); stroke-width:1; }
svg.chart .ptok { fill:var(--ok); } svg.chart .ptbad { fill:var(--bad); }
svg.chart .join { stroke:var(--muted); stroke-width:1; opacity:.45; fill:none; }
svg.chart text.miss { fill:var(--muted); font-size:14px; text-anchor:middle; }
svg.chart text.evl { fill:var(--ink); font-size:11px; text-anchor:middle; }
svg.chart text.none { font-size:9px; text-anchor:middle; }
svg.chart text.tick { text-anchor:end; } svg.chart text.limtick { fill:var(--bad); font-weight:700; }
.keyrow { display:flex; flex-wrap:wrap; gap:12px; font-size:.8rem; color:var(--muted); margin:6px 0; align-items:center; }
.dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:4px; vertical-align:middle; }
.dot.ok { background:var(--ok); } .dot.bad { background:var(--bad); }
.tablewrap { overflow-x:auto; max-width:100%; }
table { border-collapse:collapse; width:100%; font-size:.85rem; }
th, td { border-bottom:1px solid var(--line); padding:5px 8px; text-align:left; white-space:nowrap; }
th { color:var(--muted); font-weight:600; }
td.num { text-align:right; font-variant-numeric:tabular-nums; }
td.bad { color:var(--bad); font-weight:700; } td.missing { color:var(--muted); }
tr.noevent td { color:var(--muted); font-style:italic; }
a { color:var(--accent); }
.note { font-size:.85rem; color:var(--muted); }
pre.brief { white-space:pre-wrap; word-wrap:break-word; font:inherit; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; line-height:1.55; }
.actions { display:flex; flex-wrap:wrap; gap:8px; margin:10px 0; }
button.primary { background:var(--accent); color:var(--accent-ink); border:0; padding:9px 16px; border-radius:8px; font:inherit; cursor:pointer; }
button.ghost { background:var(--card); color:var(--ink); border:1px solid var(--line); padding:9px 16px; border-radius:8px; font:inherit; cursor:pointer; }
.method h2 { font-size:1.1rem; margin:20px 0 4px; }
.method p { margin:4px 0; }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.logobox { display:inline-block; background:#fefcf4; border-radius:14px; padding:6px 12px; border:1px solid var(--line); }
.logobox img { display:block; height:auto; width:min(300px,62vw); }
.hero h2 { font-size:1.35rem; line-height:1.3; margin:6px 0; }
.hero p { margin:4px 0 12px; color:var(--muted); }
.aud { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:12px; margin:12px 0 18px; }
.audcard { background:var(--card); border:1px solid var(--line); border-top:5px solid var(--accent); border-radius:12px; padding:14px 16px; }
.audcard.pub { border-top-color:#c8552a; }
.audcard h3 { margin:0 0 4px; font-size:1.05rem; }
.audcard p { margin:4px 0 10px; font-size:.95rem; color:var(--muted); }
.h2 { font-size:1.1rem; margin:22px 0 8px; }
.vis { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px; }
.viscard { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
.viscard.next { border-color:var(--accent); box-shadow:0 0 0 2px var(--soft-ok); }
.viscard .vname { font-weight:700; }
.viscard .vdate, .upd .ud { color:var(--muted); font-size:.85rem; }
.viscard .vleft { font-size:1.3rem; font-weight:700; color:var(--accent); margin:4px 0; }
.upd { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 14px; margin-bottom:8px; }
.upd b { display:block; }
ol.first { padding-left:22px; margin:6px 0; } ol.first li { margin:8px 0; }
footer { margin:24px 0 8px; color:var(--muted); font-size:.82rem; }
@media (max-width:520px) { .wrap { padding:12px; } h1 { font-size:1.35rem; } .rank { font-size:1.5rem; min-width:1.8rem; } }
@media print {
  header .lang, nav.tabs, .actions, .banner, footer { display:none !important; }
  body { background:#fff; color:#000; } pre.brief { border:0; padding:0; }
}
</style>

:65,"bad":false},{"y":2025,"f":"Durga","ph":"after","p":"pH","v":7.35,"flag":"","pg":65,"bad":false},{"y":2025,"f":"Durga","ph":"pre","p":"Dissolved oxygen","v":2.5,"flag":"","pg":65,"bad":true},{"y":2025,"f":"Durga","ph":"during","p":"Dissolved oxygen","v":2.8,"flag":"","pg":65,"bad":true},{"y":2025,"f":"Durga","ph":"after","p":"Dissolved oxygen","v":7.4,"flag":"","pg":65,"bad":false},{"y":2025,"f":"Durga","ph":"pre","p":"BOD","v":6.8,"flag":"","pg":65,"bad":true},{"y":2025,"f":"Durga","ph":"during","p":"BOD","v":11.4,"flag":"","pg":65,"bad":true},{"y":2025,"f":"Durga","ph":"after","p":"BOD","v":10.4,"flag":"","pg":65,"bad":true}]}],"brief":{"en":"GHATWISE: ghat water-risk brief for the BMC officer\nNext visarjan: Durga Visarjan, 20 October 2026\n\nBasis: MPPCB water tests at 7 Bhopal ghats, 2023 to 2025, compared with CPCB class B (outdoor bathing) limits: dissolved oxygen (DO) 5 mg/l or more, BOD 3 mg/l or less, pH 6.5 to 8.5.\n\nHeadline: across all readings, DO was below 5 mg/l in 42 of 116 tests and BOD was above 3 mg/l in 100 of 112 tests.\n\nRanking (relative priority for extra cleaning, aeration and testing):\n1. Bairagarh (Sant Hirdaram) kund, score 42/100: DO below limit in 11 of 13 tests, BOD above limit in 13 of 13 tests.\n2. Malikhedi kund, score 31/100: DO below limit in 9 of 13 tests, BOD above limit in 11 of 13 tests.\n3. Shahpura lake ghat, score 28/100: DO below limit in 5 of 18 tests, BOD above limit in 18 of 18 tests.\n4. Rani Kamlapati ghat / Kamla Park kund, score 26/100: DO below limit in 6 of 18 tests, BOD above limit in 18 of 18 tests.\n5. Hathaikheda dam / kund, score 23/100: DO below limit in 0 of 18 tests, BOD above limit in 16 of 18 tests.\n6. Khatlapura ghat, score 22/100: DO below limit in 8 of 18 tests, BOD above limit in 15 of 17 tests.\n7. Prempura ghat, score 13/100: DO below limit in 3 of 18 tests, BOD above limit in 9 of 15 tests.\n\nSuggested before the next visarjan:\n- Bairagarh (Sant Hirdaram) kund: Prioritise aeration or other oxygen support before immersion. Plan extra cleaning of organic waste and immersion material (BOD is repeatedly above the limit). Test before the next visarjan to fill the data gaps.\n  Data gaps: No Durga 2025 table in the MPPCB report, so there is no data for it. Ganesh 2025, before immersion and one week after: DO, BOD, pH not sampled.\n- Malikhedi kund: Prioritise aeration or other oxygen support before immersion. Plan extra cleaning of organic waste and immersion material (BOD is repeatedly above the limit). Test before the next visarjan to fill the data gaps.\n  Data gaps: No Durga 2025 table in the MPPCB report, so there is no data for it. Ganesh 2025, before immersion and one week after: DO, BOD, pH not sampled.\n- Shahpura lake ghat: Plan extra cleaning of organic waste and immersion material (BOD is repeatedly above the limit).\n- Any new ghat has no readings in this data. Take a baseline test before it is used.\n\nLimits of this brief:\n- This is a relative ranking of the 7 ghats, not a safe or unsafe verdict. Even the lowest-ranked ghat went beyond a limit in 14 of 50 tests.\n- A blank in the MPPCB reports means not sampled, never clean. Total coliform is not in this data.\n- The reports print no units. Standard units are assumed. No health effects are claimed.\n- Every number can be traced to its MPPCB report page in the tool.","hi":"घाटवाइज़: नगर निगम अधिकारी के लिए घाट जल-जोखिम की संक्षिप्त रिपोर्ट\nअगला विसर्जन: दुर्गा विसर्जन, 20 अक्टूबर 2026\n\nआधार: भोपाल के 7 घाटों पर MPPCB की 2023 से 2025 की जल-जाँच, CPCB श्रेणी-B (खुले में स्नान) के मानकों से तुलना: घुली ऑक्सीजन (DO) 5 mg/l या अधिक, BOD 3 mg/l या कम, pH 6.5 से 8.5।\n\nमुख्य बात: सभी जाँचों में DO 116 में से 42 बार 5 mg/l से कम और BOD 112 में से 100 बार 3 mg/l से अधिक रहा।\n\nप्राथमिकता क्रम (अतिरिक्त सफाई, एयरेशन और जाँच के लिए):\n1. बैरागढ़ (संत हिरदाराम) कुंड, अंक 42/100: DO मानक से कम 13 में से 11 जाँच में, BOD मानक से अधिक 13 में से 13 जाँच में।\n2. मालीखेड़ी कुंड, अंक 31/100: DO मानक से कम 13 में से 9 जाँच में, BOD मानक से अधिक 13 में से 11 जाँच में।\n3. शाहपुरा लेक घाट, अंक 28/100: DO मानक से कम 18 में से 5 जाँच में, BOD मानक से अधिक 18 में से 18 जाँच में।\n4. रानी कमलापति घाट / कमला पार्क कुंड, अंक 26/100: DO मानक से कम 18 में से 6 जाँच में, BOD मानक से अधिक 18 में से 18 जाँच में।\n5. हथाईखेड़ा डैम / कुंड, अंक 23/100: DO मानक से कम 18 में से 0 जाँच में, BOD मानक से अधिक 18 में से 16 जाँच में।\n6. खटलापुरा घाट, अंक 22/100: DO मानक से कम 18 में से 8 जाँच में, BOD मानक से अधिक 17 में से 15 जाँच में।\n7. प्रेमपुरा घाट, अंक 13/100: DO मानक से कम 18 में से 3 जाँच में, BOD मानक से अधिक 15 में से 9 जाँच में।\n\nअगले विसर्जन से पहले सुझाव:\n- बैरागढ़ (संत हिरदाराम) कुंड: विसर्जन से पहले एयरेशन या ऑक्सीजन बढ़ाने के उपाय को प्राथमिकता दें। जैविक कचरे और विसर्जन-सामग्री की अतिरिक्त सफाई की योजना बनाएँ (BOD बार-बार सीमा से ऊपर है)। डेटा की कमियों को भरने के लिए अगले विसर्जन से पहले जाँच कराएँ।\n  डेटा की कमियाँ: MPPCB रिपोर्ट में दुर्गा 2025 की तालिका नहीं है, इसलिए इसका कोई डेटा नहीं है। गणेश 2025, विसर्जन से पहले और विसर्जन के एक सप्ताह बाद: DO, BOD, pH की जाँच नहीं हुई।\n- मालीखेड़ी कुंड: विसर्जन से पहले एयरेशन या ऑक्सीजन बढ़ाने के उपाय को प्राथमिकता दें। जैविक कचरे और विसर्जन-सामग्री की अतिरिक्त सफाई की योजना बनाएँ (BOD बार-बार सीमा से ऊपर है)। डेटा की कमियों को भरने के लिए अगले विसर्जन से पहले जाँच कराएँ।\n  डेटा की कमियाँ: MPPCB रिपोर्ट में दुर्गा 2025 की तालिका नहीं है, इसलिए इसका कोई डेटा नहीं है। गणेश 2025, विसर्जन से पहले और विसर्जन के एक सप्ताह बाद: DO, BOD, pH की जाँच नहीं हुई।\n- शाहपुरा लेक घाट: जैविक कचरे और विसर्जन-सामग्री की अतिरिक्त सफाई की योजना बनाएँ (BOD बार-बार सीमा से ऊपर है)।\n- कोई भी नया घाट इस डेटा में नहीं है। उपयोग से पहले आधारभूत जाँच कराएँ।\n\nइस रिपोर्ट की सीमाएँ:\n- यह 7 घाटों का सापेक्ष क्रम है, सुरक्षित या असुरक्षित का फ़ैसला नहीं। सबसे नीचे वाला घाट भी 50 में से 14 जाँच में किसी मानक से बाहर रहा।\n- MPPCB रिपोर्ट में खाली जगह का मतलब जाँच नहीं हुई, साफ़ नहीं। कुल कॉलिफ़ॉर्म इस डेटा में नहीं है।\n- रिपोर्ट में इकाइयाँ नहीं छपी हैं, मानक इकाइयाँ मानी गई हैं। स्वास्थ्य पर असर का कोई दावा नहीं किया गया है।\n- हर संख्या को टूल में MPPCB रिपोर्ट के पेज से मिलाया जा सकता है।"},"updates":{"_help":"Edit this file on GitHub (pencil icon) to change the Upcoming visarjans and Updates shown on the front page. Keep the commas and quotes exactly as they are. Dates are YYYY-MM-DD. The page hides visarjans whose date has passed.","visarjans":[{"date":"2026-10-20","name_en":"Durga Visarjan","name_hi":"दुर्गा विसर्जन","note_en":"Vijayadashami","note_hi":"विजयादशमी","source":"https://www.drikpanchang.com/navratri/durga-puja/durga-visarjan-date-time.html?year=2026"},{"date":"2027-09-14","name_en":"Ganesh Visarjan","name_hi":"गणेश विसर्जन","note_en":"Anant Chaturdashi","note_hi":"अनंत चतुर्दशी","source":"https://www.drikpanchang.com/festivals/ganesh-visarjan/ganesh-visarjan-date-time.html?year=2027"},{"date":"2027-10-09","name_en":"Durga Visarjan","name_hi":"दुर्गा विसर्जन","note_en":"Vijayadashami","note_hi":"विजयादशमी","source":"https://www.drikpanchang.com/navratri/durga-puja/durga-visarjan-date-time.html?year=2027"}],"updates":[{"date":"2026-10-11","title_en":"Test readings for 2023 to 2025 are loaded","title_hi":"2023 से 2025 की जाँच के आँकड़े जोड़े गए","text_en":"7 Bhopal ghats, 1,524 MPPCB readings, each linked to its report page. Readings after 2025 are not in the tool yet.","text_hi":"भोपाल के 7 घाट, MPPCB के 1,524 आँकड़े, हर एक अपने रिपोर्ट-पेज से जुड़ा। 2025 के बाद के आँकड़े अभी टूल में नहीं हैं।","link":""},{"date":"2026-10-11","title_en":"New BMC ghats have no test readings yet","title_hi":"नगर निगम के नए घाटों की जाँच के आँकड़े अभी नहीं हैं","text_en":"This tool can only rank ghats that MPPCB has tested. A new ghat can be added once it has readings.","text_hi":"यह टूल केवल उन्हीं घाटों को क्रम में रख सकता है जिनकी MPPCB ने जाँच की है। नए घाट के आँकड़े आने पर उसे जोड़ा जा सकता है।","link":""},{"date":"2026-02-26","title_en":"NGT immersion ban: Upper and Lower Lakes","title_hi":"NGT का आदेश: const EVENTS = [['Ganesh',2023],['Durga',2023],['Ganesh',2024],['Durga',2024],['Ganesh',2025],['Durga',2025]];
const PHASES = ['pre','during','after'];
const FEST = { en: {Ganesh:'Ganesh', Durga:'Durga'}, hi: {Ganesh:'गणेश', Durga:'दुर्गा'} };
const PHN = { en: {pre:'before', during:'during', after:'1 week after'}, hi: {pre:'पहले', during:'दौरान', after:'1 सप्ताह बाद'} };
const POSS = { recency: 54, durga: 27, latest: 18 };
const PCFG = {
  'Dissolved oxygen': { min:0, max:12, ticks:[0,5,10], limits:[5], unit:' mg/l', key:'chart_do' },
  'BOD':              { min:0, max:24, ticks:[0,3,12,24], limits:[3], unit:' mg/l', key:'chart_bod' },
  'pH':               { min:5.5, max:9.5, ticks:[6,6.5,7,8,8.5,9], limits:[6.5,8.5], unit:'', key:'chart_ph' }
};

/* ---------- state ---------- */
let lang = 'en', basis = D.default_basis, tab = 'home', pendingScroll = null;
let U = D.updates || { visarjans: [], updates: [] };
const openCards = new Set();

try { const s = localStorage.getItem('gw_lang'); if (s === 'hi' || s === 'en') lang = s; } catch (e) {}

const t = k => UI[lang][k];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => String(n).replace(/\.0$/, '');
const fill = (s, o) => s.replace(/\{(\w+)\}/g, (_, k) => o[k]);
const pageLink = (yr, pg) => `<a href="${esc(D.meta.reports[yr].url)}#page=${pg}" target="_blank" rel="noopener">${t('page')} ${pg}</a>`;

/* ---------- pieces ---------- */
function confidenceFor(g, sc) {
  const poss = POSS[basis] || D.meta.expected_per_ghat;
  const c = sc.tested / poss;
  let level = c >= 0.9 ? 'High' : c >= 0.6 ? 'Medium' : 'Low';
  if (g.m.medium_site_match && level === 'High') level = 'Medium';
  return { level, poss };
}

function chart(g, param) {
  const c = PCFG[param];
  const W = 640, H = 170, ml = 34, mr = 8, mt = 10, mb = 30;
  const pw = W - ml - mr, ph = H - mt - mb, cw = pw / 6;
  const y = v => mt + (c.max - Math.min(Math.max(v, c.min), c.max)) / (c.max - c.min) * ph;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t(c.key))}">`;
  EVENTS.forEach(([f, yr], ei) => {
    const x0 = ml + ei * cw;
    s += `<rect x="${x0}" y="${mt}" width="${cw}" height="${ph}" fill="${ei % 2 === 0 ? 'var(--band)' : 'transparent'}"/>`;
    const evMissing = g.missing_events.some(e => e[0] === f && e[1] === yr);
    s += `<text class="evl" x="${x0 + cw / 2}" y="${H - 10}">${esc(FEST[lang][f])} '${String(yr).slice(2)}</text>`;
    if (evMissing) {
      s += `<rect x="${x0 + 3}" y="${mt}" width="${cw - 6}" height="${ph}" fill="url(#hatch)"><title>${esc(t('no_table'))}</title></rect>`;
      s += `<text class="none" x="${x0 + cw / 2}" y="${mt + ph / 2}">${esc(t('leg_none'))}</text>`;
      return;
    }
    const pts = [];
    PHASES.forEach((phs, pi) => {
      const x = x0 + cw * (0.2 + 0.3 * pi);
      const r = g.readings.find(q => q.p === param && q.f === f && q.y === yr && q.ph === phs);
      const label = `${FEST[lang][f]} ${yr}, ${PHN[lang][phs]}`;
      if (!r || r.v === null) {
        s += `<text class="miss" x="${x}" y="${y(c.min) - 5}">×<title>${esc(label)}: ${esc(t('leg_miss'))}</title></text>`;
        return;
      }
      pts.push([x, y(r.v)]);
      const tip = `${label}: ${fmt(r.v)}${c.unit} (${t('page')} ${r.pg})`;
      s += `<circle class="${r.bad ? 'ptbad' : 'ptok'}" cx="${x}" cy="${y(r.v)}" r="4.5"><title>${esc(tip)}</title></circle>`;
    });
    if (pts.length > 1) s += `<polyline class="join" points="${pts.map(p => p.join(',')).join(' ')}"/>`;
  });
  c.ticks.forEach(v => {
    const isLim = c.limits.includes(v);
    s += `<line class="grid" x1="${ml}" x2="${W - mr}" y1="${y(v)}" y2="${y(v)}"/>`;
    s += `<text class="tick${isLim ? ' limtick' : ''}" x="${ml - 5}" y="${y(v) + 3}">${v}</text>`;
  });
  c.limits.forEach(v => { s += `<line class="lim" x1="${ml}" x2="${W - mr}" y1="${y(v)}" y2="${y(v)}"/>`; });
  return s + '</svg>';
}

function readingsTable(g) {
  const cell = (r, pbad) => {
    if (!r || r.v === null) return `<td class="num missing" title="${esc(t('leg_miss'))}">${esc('—')}</td>`;
    return `<td class="num${r.bad ? ' bad' : ''}">${fmt(r.v)}</td>`;
  };
  let rows = '';
  EVENTS.forEach(([f, yr]) => {
    if (g.missing_events.some(e => e[0] === f && e[1] === yr)) {
      rows += `<tr class="noevent"><td>${esc(FEST[lang][f])} ${yr}</td><td colspan="5">${esc(t('no_table'))}</td></tr>`;
      return;
    }
    PHASES.forEach(phs => {
      const get = p => g.readings.find(q => q.p === p && q.f === f && q.y === yr && q.ph === phs);
      const rr = [get('pH'), get('Dissolved oxygen'), get('BOD')];
      const pages = [...new Set(rr.filter(r => r && r.pg).map(r => r.pg))].sort((a, b) => a - b);
      rows += `<tr><td>${esc(FEST[lang][f])} ${yr}</td><td>${esc(PHN[lang][phs])}</td>${rr.map(cell).join('')}<td>${pages.map(p => pageLink(yr, p)).join(', ')}</td></tr>`;
    });
  });
  return `<div class="tablewrap"><table><thead><tr><th>${t('col_event')}</th><th>${t('col_phase')}</th><th class="num">pH</th><th class="num">DO mg/l</th><th class="num">BOD mg/l</th><th>${t('col_page')}</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function card(g) {
  const sc = g.scores[basis];
  const pr = sc.priority || 3;
  const cf = confidenceFor(g, sc);
  const rr = g.rank_range[0] === g.rank_range[1]
    ? fill(t('same_rank'), { a: g.rank_range[0] })
    : fill(t('range_rank'), { a: g.rank_range[0], b: g.rank_range[1] });
  const isOpen = openCards.has(g.id) ? ' open' : '';
  const gi = D.ghats.indexOf(g);
  const years = [...new Set(g.readings.map(r => r.y))];
  return `
  <article class="card p${pr}" id="card-${gi}">
    <div class="card-top">
      <div class="rank">${sc.rank}</div>
      <div class="card-main">
        <h2>${esc(g['name_' + lang])}</h2>
        <div class="body-name">${esc(g['body_' + lang])}</div>
        <div class="badges">
          <span class="badge p${pr}">${esc(t('p' + pr))}</span>
          <span class="badge${cf.level === 'High' ? '' : ' low'}">${esc(t('conf'))}: ${esc(t(cf.level))}</span>
          <span class="badge">${esc(rr)}</span>
        </div>
        <div class="scorerow"><span>${esc(t('score'))}</span>
          <div class="bar"><span style="width:${sc.score === null ? 0 : sc.score}%"></span></div>
          <span class="scorenum">${sc.score === null ? esc(t('nodata')) : Math.round(sc.score)}/100</span></div>
        <div class="note">${esc(fill(t('used'), { a: sc.tested, b: cf.poss }))}</div>
        <div class="sec">${esc(t('why'))}</div>
        <ul>${g.reasons[lang].map(x => `<li>${esc(x)}</li>`).join('')}</ul>
        <div class="sec">${esc(t('todo'))}</div>
        <ul>${g.actions[lang].map(x => `<li>${esc(x)}</li>`).join('')}</ul>
        <details data-id="${esc(g.id)}"${isOpen}>
          <summary>${esc(t('details'))}</summary>
          <div class="sec">${esc(t('gaps'))}</div>
          ${g.gaps[lang].length ? `<ul>${g.gaps[lang].map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : `<p class="note">${esc(t('nogaps'))}</p>`}
          <p class="note">${esc(t('charts_note'))}</p>
          <div class="keyrow"><span><i class="dot ok"></i>${esc(t('leg_ok'))}</span><span><i class="dot bad"></i>${esc(t('leg_bad'))}</span><span>× ${esc(t('leg_miss'))}</span><span>▨ ${esc(t('leg_none'))}</span></div>
          ${['Dissolved oxygen', 'BOD', 'pH'].map(p => `<div class="chart-title">${esc(t(PCFG[p].key))}</div>${chart(g, p)}`).join('')}
          <div class="chart-title">${esc(t('table'))}</div>
          ${readingsTable(g)}
          ${g.metals[lang] ? `<p class="note">${esc(g.metals[lang])}</p>` : ''}
          <p class="note"><b>${esc(t('sources'))}:</b> ${years.map(y => `<a href="${esc(D.meta.reports[y].url)}" target="_blank" rel="noopener">${esc(D.meta.reports[y].name)}</a>`).join(' · ')}</p>
        </details>
      </div>
    </div>
  </article>`;
}

function rankView() {
  const h = D.headline;
  const list = [...D.ghats].sort((a, b) => a.scores[basis].rank - b.scores[basis].rank);
  const b = D.bases.find(x => x.id === basis);
  return `
  <div class="banner">${esc(t('banner'))}</div>
  <div class="stats">
    <div class="stat"><b>${h.do_below}/${h.do_tested}</b><span>${esc(t('h_do'))}</span></div>
    <div class="stat"><b>${h.bod_above}/${h.bod_tested}</b><span>${esc(t('h_bod'))}</span></div>
    <div class="stat"><b>${h.bairagarh_do_zero}</b><span>${esc(t('h_zero'))}</span></div>
  </div>
  <div class="basis"><span class="label">${esc(t('basis'))}</span>
    <div class="seg">${D.bases.map(x => `<button data-basis="${x.id}" aria-pressed="${x.id === basis}">${esc(x[lang])}</button>`).join('')}</div>
    <div class="basis-desc">${esc(b['desc_' + lang])}</div></div>
  <div class="legend"><span>${esc(t('legend_title'))}</span>
    <span class="chip p1">${esc(t('p1s'))}</span><span class="chip p2">${esc(t('p2s'))}</span><span class="chip p3">${esc(t('p3s'))}</span></div>
  ${list.map(card).join('')}`;
}

function briefView() {
  return `
  <p class="note">${esc(t('brief_note'))}</p>
  <div class="actions">
    <button class="primary" data-copy="one">${esc(t('copy'))}</button>
    <button class="ghost" data-copy="both">${esc(t('copy_both'))}</button>
    <button class="ghost" data-print="1">${esc(t('print'))}</button>
  </div>
  <pre class="brief" id="brief">${esc(D.brief[lang])}</pre>`;
}

function methodView() {
  return `<div class="method">${METHOD[lang].map(sec => `
    <h2>${esc(sec.h)}</h2>
    ${(sec.p || []).map(p => `<p>${esc(p)}</p>`).join('')}
    ${sec.items ? `<ul>${sec.items.map(i => `<li>${esc(i)}</li>`).join('')}</ul>` : ''}`).join('')}</div>`;
}

const MONTHS = { en: ['January','February','March','April','May','June','July','August','September','October','November','December'],
                 hi: ['जनवरी','फ़रवरी','मार्च','अप्रैल','मई','जून','जुलाई','अगस्त','सितंबर','अक्टूबर','नवंबर','दिसंबर'] };
const fmtDate = iso => { const [y, m, d] = iso.split('-').map(Number); return `${d} ${MONTHS[lang][m - 1]} ${y}`; };
const daysTo = iso => Math.ceil((new Date(iso + 'T00:00:00+05:30').getTime() - Date.now()) / 86400000);
const safeUrl = u => (/^https?:\/\//.test(u || '') ? u : '');
const pick = (o, k) => (o[k + '_' + lang] || o[k + '_en'] || '');

function upcoming() {
  return (U.visarjans || []).map(v => Object.assign({ n: daysTo(v.date) }, v)).filter(v => v.n >= 0)
    .sort((a, b) => (a.date < b.date ? -1 : 1));
}

function homeView() {
  const h = D.headline;
  const up = upcoming();
  const first = [...D.ghats].sort((a, b) => a.scores[D.default_basis].rank - b.scores[D.default_basis].rank).slice(0, 3);
  const ups = [...(U.updates || [])].sort((a, b) => (a.date < b.date ? 1 : -1));
  const left = n => (n === 0 ? t('up_today') : n === 1 ? t('up_tomorrow') : fill(t('up_days'), { n }));
  return `
  <section class="hero">
    <h2>${esc(t('home_hero_h'))}</h2>
    <p>${esc(t('home_hero_p'))}</p>
  </section>
  <div class="aud">
    <div class="audcard">
      <h3>${esc(t('aud_officer_h'))}</h3><p>${esc(t('aud_officer_p'))}</p>
      <div class="actions"><button class="primary" data-go="rank">${esc(t('aud_officer_btn'))}</button><button class="ghost" data-go="brief">${esc(t('aud_officer_btn2'))}</button></div>
    </div>
    <div class="audcard pub">
      <h3>${esc(t('aud_public_h'))}</h3><p>${esc(t('aud_public_p'))}</p>
      <div class="actions"><button class="primary" data-go="public">${esc(t('aud_public_btn'))}</button></div>
    </div>
  </div>
  <div class="h2">${esc(t('up_h'))}</div>
  ${up.length ? `<div class="vis">${up.map((v, i) => `
    <div class="viscard${i === 0 ? ' next' : ''}">
      ${i === 0 ? `<span class="badge p3">${esc(t('up_next'))}</span>` : ''}
      <div class="vname">${esc(pick(v, 'name'))}</div>
      <div class="vdate">${esc(fmtDate(v.date))}${pick(v, 'note') ? ' · ' + esc(pick(v, 'note')) : ''}</div>
      <div class="vleft">${esc(left(v.n))}</div>
      ${safeUrl(v.source) ? `<a class="note" href="${esc(safeUrl(v.source))}" target="_blank" rel="noopener">${esc(t('up_src'))}</a>` : ''}
    </div>`).join('')}</div>
    <p class="note">${esc(t('up_note'))}</p>` : `<p class="note">${esc(t('up_none'))}</p>`}
  <div class="h2">${esc(t('upd_h'))}</div>
  ${ups.length ? ups.map(u => `
    <div class="upd"><span class="ud">${esc(fmtDate(u.date))}</span><b>${esc(pick(u, 'title'))}</b>
      <span>${esc(pick(u, 'text'))}</span>
      ${safeUrl(u.link) ? ` <a href="${esc(safeUrl(u.link))}" target="_blank" rel="noopener">${esc(t('upd_link'))}</a>` : ''}</div>`).join('') : `<p class="note">${esc(t('upd_none'))}</p>`}
  <div class="h2">${esc(t('first_h'))}</div>
  <p class="note">${esc(t('first_p'))}</p>
  <ol class="first">${first.map(g => `<li><b>${esc(g['name_' + lang])}</b> (${Math.round(g.scores[D.default_basis].score)}/100)<br><span class="note">${esc(g.reasons[lang][0] || '')}</span></li>`).join('')}</ol>
  <div class="actions"><button class="ghost" data-go="rank">${esc(t('first_all'))}</button></div>
  <div class="stats">
    <div class="stat"><b>${h.do_below}/${h.do_tested}</b><span>${esc(t('h_do'))}</span></div>
    <div class="stat"><b>${h.bod_above}/${h.bod_tested}</b><span>${esc(t('h_bod'))}</span></div>
    <div class="stat"><b>${h.bairagarh_do_zero}</b><span>${esc(t('h_zero'))}</span></div>
  </div>`;
}

function publicView() {
  const rows = [...D.ghats].map(g => ({ g, i: D.ghats.indexOf(g) })).sort((a, b) => a.g.name_en.localeCompare(b.g.name_en));
  return `
  <h2 class="h2" style="margin-top:4px">${esc(t('pub_h'))}</h2>
  <p>${esc(t('pub_intro'))}</p>
  <div class="h2">${esc(t('pub_what_h'))}</div>
  <ul>${t('pub_what').map(x => `<li>${esc(x)}</li>`).join('')}</ul>
  <div class="h2">${esc(t('pub_table_h'))}</div>
  ${rows.map(({ g, i }) => `<div class="upd">
    <b>${esc(g['name_' + lang])}</b><span class="ud">${esc(g['body_' + lang])}</span>
    <div>${esc(t('pub_col_do'))}: <b style="display:inline">${esc(fill(t('pub_tests'), { a: g.m.do_below, b: g.m.do_tested }))}</b></div>
    <div>${esc(t('pub_col_bod'))}: <b style="display:inline">${esc(fill(t('pub_tests'), { a: g.m.bod_above, b: g.m.bod_tested }))}</b></div>
    <div class="actions"><button class="ghost" data-open="${i}">${esc(t('pub_open'))}</button></div></div>`).join('')}
  <div class="banner" style="margin-top:16px"><b>${esc(t('pub_note_h'))}</b><ul>${t('pub_notes').map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`;
}

function shell() {
  return `
  <header>
    <div class="brand">
      <h1 class="sr">GhatWise</h1>
      <div class="logobox"><img src="${esc(D.meta.logo)}" alt="GhatWise" width="620" height="248"></div>
      <p class="sub" style="margin-top:8px">${esc(t('sub'))}</p>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="en" aria-pressed="${lang === 'en'}">EN</button>
      <button data-lang="hi" aria-pressed="${lang === 'hi'}">हिं</button>
    </div>
  </header>
  <nav class="tabs" role="tablist">
    ${[['home', 'tab_home'], ['rank', 'tab_rank'], ['public', 'tab_public'], ['brief', 'tab_brief'], ['method', 'tab_method']].map(([k, l]) =>
      `<button role="tab" data-tab="${k}" aria-selected="${tab === k}">${esc(t(l))}</button>`).join('')}
  </nav>
  <main>${tab === 'home' ? homeView() : tab === 'rank' ? rankView() : tab === 'public' ? publicView() : tab === 'brief' ? briefView() : methodView()}</main>
  <footer>${esc(fill(t('built'), { d: D.meta.built }))}</footer>`;
}

async function loadUpdates() {
  try {
    const r = await fetch('updates.json?' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const j = await r.json();
    if (j && Array.isArray(j.visarjans) && Array.isArray(j.updates)) { U = j; render(); }
  } catch (e) { /* offline or a bad edit: keep the copy built into this page */ }
}

async function copyText(txt, btn) {
  try { await navigator.clipboard.writeText(txt); }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (_) {} ta.remove();
  }
  const old = btn.textContent; btn.textContent = t('copied');
  setTimeout(() => { btn.textContent = old; }, 1500);
}

function render() {
  document.documentElement.lang = lang;
  document.getElementById('app').innerHTML = shell();
  if (pendingScroll) { const el = document.getElementById(pendingScroll); pendingScroll = null; if (el) el.scrollIntoView({ block: 'start' }); }
}

document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.lang) { lang = b.dataset.lang; try { localStorage.setItem('gw_lang', lang); } catch (_) {} render(); }
  else if (b.dataset.tab) { tab = b.dataset.tab; render(); window.scrollTo(0, 0); }
  else if (b.dataset.go) { tab = b.dataset.go; render(); window.scrollTo(0, 0); }
  else if (b.dataset.open !== undefined) { openCards.add(D.ghats[+b.dataset.open].id); tab = 'rank'; pendingScroll = 'card-' + b.dataset.open; render(); }
  else if (b.dataset.basis) { basis = b.dataset.basis; render(); }
  else if (b.dataset.copy) { copyText(b.dataset.copy === 'both' ? D.brief.en + '\n\n' + '────────\n\n' + D.brief.hi : D.brief[lang], b); }
  else if (b.dataset.print) { window.print(); }
});
document.addEventListener('toggle', e => {
  const d = e.target;
  if (d && d.tagName === 'DETAILS' && d.dataset.id) { d.open ? openCards.add(d.dataset.id) : openCards.delete(d.dataset.id); }
}, true);

render();
loadUpdates();
</script>
</body>
</html>
